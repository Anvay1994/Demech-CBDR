<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demech — Report Portal</title>
  <meta name="description" content="Demech Centrifugal Cast Basalt Pipe Production — Report Portal">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🏭</text></svg>">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js?v=27"></script> <!-- APPS_SCRIPT_URL + API_TOKEN only; app.js is 174 KB and unused here -->
</head>

<body>
  <!-- Animated particles background -->
  <div class="login-particles" id="loginParticles"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="Logo _ DEMECH New[2].png" alt="Demech" width="134" height="48" class="login-logo-img">
        <div class="login-divider"></div>
        <p>Centrifugal Cast Basalt Pipe Production<br><span class="login-subtitle-small">Report Portal</span></p>
      </div>
      <form id="loginForm" onsubmit="return false">
        <div id="g_id_onload"
             data-client_id="770624165399-5o2669i3pnd61rn7ufmej4r1qlcrj27m.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="filled_black"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left"
             data-width="340">
        </div>

        <div class="form-options" style="justify-content: center; margin-top: 1.5rem;">
          <label class="checkbox-container">
            <input type="checkbox" id="rememberMe" checked>
            <span class="checkmark"></span>
            <span class="checkbox-label">Keep me logged in</span>
          </label>
        </div>
        
        <p id="loginStatus" class="login-status-msg">Sign in with your work email</p>
        <p id="loginError" class="login-error">Access Denied: Email not in whitelist</p>
      </form>
      <div class="login-footer">
        <span>Secured access · Demech Industries</span>
      </div>
    </div>
  </div>

  <script>
    // Check if already logged in (session or persistent)
    if (sessionStorage.getItem('demech_auth') === 'true' || localStorage.getItem('demech_auth') === 'true') {
      window.location.href = 'dashboard.html';
    }

    function decodeJwtResponse(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function (c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    async function handleCredentialResponse(response) {
      const statusEl = document.getElementById('loginStatus');
      const errorEl = document.getElementById('loginError');
      
      try {
        statusEl.textContent = 'Verifying authorization...';
        statusEl.classList.add('loading');
        
        const responsePayload = decodeJwtResponse(response.credential);
        const email = responsePayload.email;
        
        // Verify with Apps Script
        const verifyUrl = `${APPS_SCRIPT_URL}?token=${encodeURIComponent(API_TOKEN)}&action=verify&email=${encodeURIComponent(email)}`;
        const res = await fetch(verifyUrl);
        const json = await res.json();
        
        if (json.success) {
          const rememberMe = document.getElementById('rememberMe').checked;
          const storage = rememberMe ? localStorage : sessionStorage;
          
          storage.setItem('demech_auth', 'true');
          storage.setItem('demech_user_email', email);
          storage.setItem('demech_user_name', json.user.name || responsePayload.name);
          storage.setItem('demech_user_role', json.user.role || '');

          // Success animation
          document.querySelector('.login-card').classList.add('login-success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
        } else {
          statusEl.textContent = 'Sign in with your work email';
          statusEl.classList.remove('loading');
          errorEl.textContent = json.error || 'Access Denied: Email not in whitelist';
          errorEl.classList.add('show');
          setTimeout(() => errorEl.classList.remove('show'), 5000);
        }
      } catch (err) {
        console.error('Login error:', err);
        statusEl.textContent = 'Sign in with your work email';
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.classList.add('show');
      }
    }

    // Particle animation
    (function () {
      const canvas = document.getElementById('loginParticles');
      if (!canvas) return;
      const container = document.querySelector('.login-container');
      for (let i = 0; i < 30; i++) {
        const dot = document.createElement('div');
        dot.className = 'particle';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = Math.random() * 100 + '%';
        dot.style.animationDelay = Math.random() * 6 + 's';
        dot.style.animationDuration = (4 + Math.random() * 6) + 's';
        dot.style.width = dot.style.height = (2 + Math.random() * 3) + 'px';
        canvas.appendChild(dot);
      }
    })();
  </script>
</body>

</html>
